name: eval

on:
  workflow_dispatch:              # il pulsante "Run workflow" nell'interfaccia
  # Niente schedule: è un progetto di studio, e l'eval in CI parte solo a mano (vedi il README)

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 60           # un eval bloccato non resta acceso a spese tue
    services:
      postgres:                   # un Postgres usa-e-getta per questo job
        image: pgvector/pgvector:pg16
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: lipari_ai }
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-retries 5
      ollama:                     # il modello e gli embedding, come in locale: nessuna chiave
        image: ollama/ollama
        ports: ["11434:11434"]

    env:                          # a livello di job: le vedono TUTTI i passi
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/lipari_ai
      DEFAULT_MODEL: llama3.2:3b
      EMBEDDING_MODEL: nomic-embed-text
      OLLAMA_BASE_URL: http://localhost:11434/v1
      # Settings le pretende; con Ollama non si usano, e non sono chiavi vere
      OPENAI_API_KEY: non-usata-con-ollama
      ANTHROPIC_API_KEY: non-usata-con-ollama
      # Settings lo pretende; qui non si firma nessun token vero, ma deve esserci
      JWT_SECRET: segreto-della-ci-che-non-firma-niente-di-vero

    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - name: i due modelli nel servizio Ollama (circa 2,3 GB)
        run: |
          for modello in llama3.2:3b nomic-embed-text; do
            curl -sSf --retry 10 --retry-connrefused --retry-delay 3 \
              http://localhost:11434/api/pull -d "{\"model\": \"$modello\", \"stream\": false}"
          done
      - run: uv run alembic upgrade head
      - run: uv run python -m scripts.seed_accounts    # i clienti e i conti delle traiettorie
      - run: uv run python -m evals.ingest_fixtures    # i documenti dell'advice
      - run: uv run python -m evals.runner             # ← se esce ≠0, il job fallisce
