version: '3.8'
services:
  postgres:
    image: pgvector/pgvector:pg16  # PostgreSQL 16 + pgvector preinstallato
    environment:
      POSTGRES_USER: lipari
      POSTGRES_PASSWORD: lipari
      POSTGRES_DB: lipari_ai
    ports:
      - "5433:5432"
    volumes:
      - lipari-ai-data:/var/lib/postgresql/data

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

volumes:
  lipari-ai-data:
  ollama_data: